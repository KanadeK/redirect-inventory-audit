[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[project]
name = "redirect-map-audit"
version = "0.1.0"
description = "Offline redirect maps checked against retired and current route inventories"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "KanadeK"}]
dependencies = []
keywords = ["cli", "offline", "validation"]
classifiers = ["Programming Language :: Python :: 3", "Operating System :: OS Independent"]

[project.scripts]
redirect-map-audit = "redirect_map_audit.cli:main"

[project.urls]
Repository = "https://github.com/KanadeK/redirect-map-audit"
Issues = "https://github.com/KanadeK/redirect-map-audit/issues"

[tool.setuptools.packages.find]
include = ["redirect_map_audit*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
